version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: client_hunting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/client_hunting

volumes:
  postgres_data:
